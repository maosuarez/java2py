[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "java2py"
dynamic = ["version"]
description = "Traductor de Java a Python para estudiar, con una enciclopedia de algoritmos y estructuras de datos incluida. Sin IA."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mauricio Suárez Barrera" }]
keywords = ["java", "python", "translator", "transpiler", "education", "algorithms", "data-structures", "encyclopedia", "dsa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Programming Language :: Java",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/maosuarez/java2py"
Issues = "https://github.com/maosuarez/java2py/issues"

[project.scripts]
java2py = "java2py.cli:main"
java2py-enc = "java2py.enciclopedia.cli:main"

[tool.hatch.version]
path = "src/java2py/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/java2py"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
